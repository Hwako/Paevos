<style>
.hero-sub{grid-template-columns:minmax(0,1fr);gap:18px;max-width:600px}
.joinslot .join .btn{background:var(--lav);color:#17161D;min-height:48px;padding:0 22px;font-size:15px;font-weight:600}
.hero .joinslot{padding:16px 18px 12px;border:1px solid var(--ink);background:var(--paper-2)}
.hero .joinslot::before{content:"Get early access when Paevos launches";display:block;font:500 22px/1.2 var(--serif);margin-bottom:10px}
.hero .join input,.final .join input{font-size:17px;padding:12px 0}
.final{background:var(--brand);color:var(--brand-ink)}
.final h2 em{color:var(--lav)}
.final-row{grid-template-columns:minmax(0,4fr) minmax(0,6fr) minmax(0,2fr);border-top-color:var(--brand-rule)}
.final-row>p{color:var(--brand-muted);font-size:17px}
.final .join{border-bottom-color:var(--brand-ink)}
.final .join input{color:var(--brand-ink)}
.final .join input::placeholder,.final .join .jl,.final .formnote{color:var(--brand-muted)}
.final .done{border-top-color:var(--brand-ink);color:var(--brand-muted)}
.final .done b{color:var(--brand-ink)}
.final .pills .b{background:#FFFFFF}
.cta-bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:16px;padding:8px 8px 8px 18px;max-width:calc(100% - 32px);background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand-rule);transform:translate(-50%,160%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.cta-bar.show{transform:translate(-50%,0)}
.cta-bar span{font-size:14px;white-space:nowrap}
.cta-bar .btn{background:var(--lav);color:#17161D;font-weight:600}
.steps,.rows{perspective:1000px}
.r3d{opacity:0;transform:rotateX(-65deg) translateY(16px);transform-origin:50% 0;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1),padding .3s}
.r3d.in{opacity:1;transform:none}
.prow{perspective:900px}
.prow h3{transform-origin:50% 100%;will-change:transform}
.step{cursor:default}
.step.on{padding-left:12px}
.step.on dt{color:var(--lav-text)}
.receipt .p,.receipt .stamp{transition:opacity .35s ease}
.receipt[data-focus] .p{opacity:.22}
.receipt[data-focus="ask"] .p:nth-child(-n+6){opacity:1}
.receipt[data-focus="check"] .p:nth-child(n+8){opacity:1}
.receipt[data-focus] .stamp{opacity:.22}
.receipt[data-focus="answer"] .stamp{opacity:1}
.final .pills{max-width:150px}
@media (max-width:900px){.final-row{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.drum{max-width:84%}.joinslot .join .btn{flex:1 1 100%}}
@media (max-width:520px){.cta-bar span{display:none}.cta-bar{padding:8px}}
@media (prefers-reduced-motion:reduce){.r3d{opacity:1;transform:none}}
</style>
