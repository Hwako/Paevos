<script>
(function(){
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const joined = () => { try{ return localStorage.getItem('paevos-joined') === '1'; }catch(e){ return false; } };
const bar = document.createElement('div');
bar.className = 'cta-bar';
bar.innerHTML = '<span>Paevos is coming to iPhone.</span><a class="btn" href="#join">Get early access</a>';
document.body.appendChild(bar);
bar.querySelector('a').addEventListener('click', e => {
e.preventDefault();
document.getElementById('join').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
setTimeout(() => { const i = document.getElementById('email-final'); if (i) i.focus({ preventScroll: true }); }, reduce ? 0 : 700);
});
const hero = document.querySelector('.hero'), fin = document.getElementById('join');
const rev = [...document.querySelectorAll('.steps .step, .rows .lrow2')];
rev.forEach(el => el.classList.add('r3d'));
if (reduce || !('IntersectionObserver' in window)) rev.forEach(el => el.classList.add('in'));
else {
const io = new IntersectionObserver(es => es.forEach(en => {
if (!en.isIntersecting) return;
const sib = [...en.target.parentElement.children];
en.target.style.transitionDelay = (sib.indexOf(en.target) * 120) + 'ms';
en.target.classList.add('in');
setTimeout(() => { en.target.style.transitionDelay = ''; }, 1400);
io.unobserve(en.target);
}), { threshold: .3 });
rev.forEach(el => io.observe(el));
}
const heads = [...document.querySelectorAll('.prow h3')];
const rc = document.getElementById('receipt'), steps = [...document.querySelectorAll('.steps .step')], keys = ['ask', 'check', 'answer'];
let hovering = false, cyc = 0, cycTimer = null;
const focusStep = i => { if (!rc) return; if (i < 0){ delete rc.dataset.focus; } else rc.dataset.focus = keys[i]; steps.forEach((s, j) => s.classList.toggle('on', j === i)); };
steps.forEach((s, i) => {
s.addEventListener('pointerenter', () => { hovering = true; focusStep(i); });
s.addEventListener('pointerleave', () => { hovering = false; focusStep(-1); });
s.tabIndex = 0; s.addEventListener('focus', () => focusStep(i)); s.addEventListener('blur', () => focusStep(-1));
});
const how = document.querySelector('.how');
if (!reduce && how && 'IntersectionObserver' in window){
new IntersectionObserver(es => es.forEach(en => {
clearInterval(cycTimer);
if (en.isIntersecting){ cycTimer = setInterval(() => { if (!hovering){ focusStep(cyc % 3); cyc++; } }, 1800); }
else if (!hovering) focusStep(-1);
}), { threshold: .5 }).observe(how);
}
let tick = false;
function frame(){
const vh = innerHeight;
bar.classList.toggle('show', hero.getBoundingClientRect().bottom < 0 && fin.getBoundingClientRect().top > vh * .85 && !joined());
if (!reduce) heads.forEach(h => {
const r = h.getBoundingClientRect();
const p = Math.min(1, Math.max(0, (vh - r.top) / (vh * .45)));
h.style.transform = `rotateX(${(1 - p) * -80}deg) translateY(${(1 - p) * 24}px)`;
h.style.opacity = (.2 + .8 * p).toFixed(3);
});
tick = false;
}
addEventListener('scroll', () => { if (!tick){ tick = true; requestAnimationFrame(frame); } }, { passive: true });
addEventListener('resize', frame);
frame();
})();
</script>
