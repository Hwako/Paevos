<script>
(function(){
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const box = document.getElementById('trChart'), svg = document.getElementById('trSvg'), tip = document.getElementById('trTip');
const stats = document.getElementById('trStats'), legend = document.getElementById('trLegend'), note = document.getElementById('trNote');
const tblBtn = document.getElementById('trTblBtn'), tbl = document.getElementById('trTable');
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const cum = a => { let t = 0; return a.map(v => t += v); };
// example data
const lastD = [42,38,55,61,88,95,40,35,47,52,70,92,101,38,44,36,58,66,85,90,41,39,50,49,63,97,88,45,30,40];
const thisD = [35,40,48,52,80,84,30,33,41,45,60,78,90,35,38,30,50,55,72,80,36,34,42,32];
const tm = cum(thisD), lm = cum(lastD), today = thisD.length - 1;
const days = Array.from({length:30}, (_, i) => 'Day ' + (i + 1));
const weeks = Array.from({length:12}, (_, i) => i === 11 ? 'This week' : (11 - i) + ' wk ago');
const months = ["Jun '26","Jul '26","Aug '26","Sep '26","Oct '26","Nov '26","Dec '26","Jan '27","Feb '27","Mar '27","Apr '27","May '27","Jun '27"];
const M = {
spend: {
label: 'Line chart of example spending this month compared with last month',
x: days, ticks: [0,7,14,21,29], tickText: i => String(i + 1), fmt: money, y0: 0,
series: [
{ n:'This month', c:'var(--c1)', d: tm, area:true },
{ n:'Last month', c:'var(--c0)', dash:true, d: lm }
],
stats: [['Spent so far', money(tm[today])], ['Last month, same day', money(lm[today])], ['Under last month', money(lm[today] - tm[today])]],
note: 'Example data. Running total by day of the month.'
},
score: {
label: 'Line chart of an example health score over the last 12 weeks',
x: weeks, ticks: [0,3,7,11], tickText: i => i === 11 ? 'Now' : (11 - i) + 'w', fmt: v => String(v), y0: 50, y1: 100, step: 10,
series: [ { n:'Health score', c:'var(--c1)', d:[64,66,65,69,71,70,73,74,76,75,78,81], area:true } ],
stats: [['This week','81'], ['12 weeks ago','64'], ['Change','+17']],
note: 'Example data. Weekly money health score.'
},
save: {
label: 'Line chart of example savings toward a $3,000 goal, with a projection',
x: months, ticks: [0,4,8,12], tickText: i => months[i], fmt: money, y0: 0, y1: 3400, step: 1000, goal: 3000,
series: [
{ n:'Saved', c:'var(--c1)', d:[240,520,830,1120,1440], area:true },
{ n:'Projected', c:'var(--c1)', dash:true, d:[null,null,null,null,1440,1635,1830,2025,2220,2415,2610,2805,3000] }
],
stats: [['Saved','$1,440'], ['Pace','$45 a week'], ['Projected finish',"Jun '27"]],
note: 'Example data. Tokyo trip goal, projected at the current pace.'
}
};
const niceStep = x => { const p = 10 ** Math.floor(Math.log10(x)); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
let cur = 'spend', geo = null, raf = null;
function draw(key, animate){
const m = M[key];
const W = box.clientWidth, H = box.clientHeight, narrow = W < 600;
const pl = 46, pr = narrow ? 12 : 144, pt = 14, pb = 26;
const n = m.x.length;
const xs = i => pl + i * (W - pl - pr) / (n - 1);
const all = m.series.flatMap(s => s.d.filter(v => v != null));
const lo = m.y0 ?? 0;
const step = m.step || niceStep((Math.max(...all) - lo) / 4);
const hi = m.y1 ?? Math.ceil(Math.max(...all) * 1.06 / step) * step;
const ys = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
const fmtAx = v => m.fmt === money ? (v >= 1000 ? '$' + (v / 1000) + 'k' : '$' + v) : String(v);
let o = `<defs><linearGradient id="trGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c1)" stop-opacity=".22"/><stop offset="1" style="stop-color:var(--c1)" stop-opacity="0"/></linearGradient>
<clipPath id="trClip"><rect id="trClipR" x="0" y="0" width="${animate && !reduce ? 0 : W}" height="${H}"/></clipPath></defs>`;
for (let v = lo; v <= hi + 1e-9; v += step){
o += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${ys(v)}" y2="${ys(v)}"/><text class="ax" x="${pl - 8}" y="${ys(v) + 3}" text-anchor="end">${fmtAx(v)}</text>`;
}
m.ticks.forEach((i, k) => {
const anchor = k === 0 ? 'start' : k === m.ticks.length - 1 ? 'end' : 'middle';
o += `<text class="ax" x="${xs(i)}" y="${H - 8}" text-anchor="${anchor}">${m.tickText(i)}</text>`;
});
if (m.goal){
o += `<line x1="${pl}" x2="${W - pr}" y1="${ys(m.goal)}" y2="${ys(m.goal)}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 4"/><text class="dl" x="${pl + 6}" y="${ys(m.goal) - 7}">Goal ${money(m.goal)}</text>`;
}
o += '<g clip-path="url(#trClip)">';
m.series.forEach(s => {
let d = '', first = -1, lastI = -1;
s.d.forEach((v, i) => { if (v == null) return; d += (first < 0 ? 'M' : 'L') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1); if (first < 0) first = i; lastI = i; });
if (s.area) o += `<path d="${d}L${xs(lastI)} ${ys(lo)}L${xs(first)} ${ys(lo)}Z" fill="url(#trGrad)"/>`;
o += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 5"' : ''}/>`;
s._last = lastI;
});
m.series.forEach(s => {
const i = s._last, v = s.d[i];
o += `<circle cx="${xs(i)}" cy="${ys(v)}" r="4.5" fill="${s.c}" stroke="var(--paper-2)" stroke-width="2"/>`;
if (!narrow) o += `<text class="dl" x="${xs(i) + 10}" y="${ys(v) + 4}">${s.n} ${m.fmt(v)}</text>`;
});
o += '</g>';
o += `<line id="trXh" class="xh" x1="0" x2="0" y1="${pt}" y2="${H - pb}" visibility="hidden"/>`;
m.series.forEach((s, k) => { o += `<circle id="trDot${k}" r="4.5" fill="${s.c}" stroke="var(--paper-2)" stroke-width="2" visibility="hidden"/>`; });
o += `<rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent" id="trHit"/>`;
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.innerHTML = o;
geo = { m, xs, ys, pl, pr, W, n };
if (animate && !reduce){
const r = document.getElementById('trClipR'), t0 = performance.now();
cancelAnimationFrame(raf);
const tick = t => { const p = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - p, 3); r.setAttribute('width', W * e); if (p < 1) raf = requestAnimationFrame(tick); };
raf = requestAnimationFrame(tick);
}
}
function hover(e){
if (!geo) return;
const { m, xs, ys, pl, pr, W, n } = geo;
const x = e.clientX - svg.getBoundingClientRect().left;
if (x < pl - 10 || x > W - pr + 10){ leave(); return; }
const i = Math.max(0, Math.min(n - 1, Math.round((x - pl) / (W - pl - pr) * (n - 1))));
const xh = document.getElementById('trXh');
xh.setAttribute('x1', xs(i)); xh.setAttribute('x2', xs(i)); xh.setAttribute('visibility', 'visible');
let rows = '';
m.series.forEach((s, k) => {
const dot = document.getElementById('trDot' + k), v = s.d[i];
if (v == null){ dot.setAttribute('visibility', 'hidden'); return; }
dot.setAttribute('cx', xs(i)); dot.setAttribute('cy', ys(v)); dot.setAttribute('visibility', 'visible');
rows += `<div class="tr"><span><i class="sw${s.dash ? ' dash' : ''}" style="border-color:${s.c}"></i>${s.n}</span><span>${m.fmt(v)}</span></div>`;
});
if (!rows){ leave(); return; }
tip.innerHTML = `<div class="tl">${m.x[i]}</div>${rows}`;
tip.hidden = false;
const tw = tip.offsetWidth;
tip.style.left = (xs(i) + 14 + tw > W ? xs(i) - 14 - tw : xs(i) + 14) + 'px';
}
function leave(){
tip.hidden = true;
const xh = document.getElementById('trXh'); if (xh) xh.setAttribute('visibility', 'hidden');
svg.querySelectorAll('[id^="trDot"]').forEach(d => d.setAttribute('visibility', 'hidden'));
}
svg.addEventListener('pointermove', hover);
svg.addEventListener('pointerdown', hover);
svg.addEventListener('pointerleave', leave);
function panel(key){
const m = M[key];
stats.innerHTML = m.stats.map(([l, v]) => `<div><span class="kicker">${l}</span><b>${v}</b></div>`).join('');
legend.innerHTML = m.series.length > 1 ? m.series.map(s => `<span><i class="sw${s.dash ? ' dash' : ''}" style="border-color:${s.c}"></i>${s.n}</span>`).join('') : '';
note.textContent = m.note;
box.setAttribute('aria-label', m.label);
if (!tbl.hidden) table();
}
function table(){
const m = M[cur];
tbl.innerHTML = `<table><thead><tr><th></th>${m.series.map(s => `<th>${s.n}</th>`).join('')}</tr></thead><tbody>${
m.x.map((x, i) => `<tr><th scope="row">${x}</th>${m.series.map(s => `<td>${s.d[i] == null ? '' : m.fmt(s.d[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
tblBtn.addEventListener('click', () => {
const open = tbl.hidden; tbl.hidden = !open;
tblBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
tblBtn.textContent = open ? 'Hide table' : 'View as table';
if (open) table();
});
const tabs = [...document.querySelectorAll('.tr-tabs button')];
tabs.forEach(t => t.addEventListener('click', () => {
if (t.dataset.m === cur) return;
cur = t.dataset.m;
tabs.forEach(x => x.setAttribute('aria-selected', x === t ? 'true' : 'false'));
leave(); panel(cur);
if (!reduce){ box.classList.remove('flip'); void box.offsetWidth; box.classList.add('flip'); }
draw(cur, true);
}));
panel(cur); draw(cur, false);
let seen = false;
if ('IntersectionObserver' in window && !reduce){
const io = new IntersectionObserver(es => { es.forEach(en => { if (en.isIntersecting && !seen){ seen = true; draw(cur, true); io.disconnect(); } }); }, { threshold: .4 });
io.observe(box);
}
let rt = null;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => draw(cur, false), 120); });
})();
</script>
</body>
</html>
